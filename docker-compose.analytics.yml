version: "3.8"

x-build-args: &build-args
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1

services:
  drizzle-studio:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile
      args:
        <<: *build-args
    restart: always
    env_file:
      - ./.env
    environment:
      PORT: "4983"
      STORE_PATH: /app
      # MASTERPASS removed - OAuth2 Proxy handles authentication
      # Only authenticated admins via Zitadel/Fajr EMR can reach this service
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - drizzle-data:/app

    # ✅ internal only (no public port on the host)
    expose:
      - "4983"

    networks:
      coolify:
        aliases:
          - drizzle-studio

    labels:
      coolify.name: "Drizzle Studio"
      coolify.description: "Drizzle Studio Gateway running on port 4983"
      # NOTE: Caddy routing removed - OAuth2 Proxy in docker-compose.auth.yml
      # handles public access at analytics.fajrmission.org with SSO

    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget --no-verbose --tries=1 --spider http://localhost:4983/ || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  drizzle-data:
    driver: local

networks:
  coolify:
    external: true
