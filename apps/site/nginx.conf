# nginx config for the static public site export (apps/site/out)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy, keep redirects relative (no http://host:80/...)
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Old web-app path: the about page now lives at the site root
    location = /about { return 301 /; }
    location = /about/ { return 301 /; }

    # Hashed Next.js assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
