# PowerSync Service Configuration
# ⚠️  THIS FILE IS NOT USED IN PRODUCTION
# The actual config is generated at runtime by entrypoint.sh from DATABASE_URL env var.
# This file exists only as a reference/template for local development.

# Replication source configuration
replication:
  connections:
    - type: postgresql
      # In production: set DATABASE_URL env var in Coolify/docker-compose
      uri: ${DATABASE_URL}
      sslmode: disable
      # Replication slot settings
      slot_name: powersync_slot
      publication_name: powersync_publication

# Connection settings for sync bucket storage
storage:
  type: postgresql
  uri: ${DATABASE_URL}
  sslmode: disable

# The port which the PowerSync API server will listen on
port: 6061

# Specify sync rules
sync_rules:
  path: /config/sync-rules.yaml

# Settings for client authentication
client_auth:
  # Supabase Auth integration
  supabase: false

  # JWT validation using shared secret (HS256)
  # In production: set JWT_SECRET env var - entrypoint.sh will base64url encode it
  jwks:
    keys:
      - kid: "fajr-emr-key"
        kty: oct
        k: ${JWT_SECRET_BASE64URL}
        alg: HS256

  # JWT audience
  audience: ["powersync", "powersync-dev"]

  # JWT issuer
  issuer: https://fajrmission.org

# Settings for telemetry reporting
telemetry:
  # Opt out of reporting anonymized usage metrics
  disable_telemetry_sharing: true

# Diagnostics
diagnostics:
  disable: false

# Logging
log_level: info
